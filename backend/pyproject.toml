[project]
name = "runpad"
version = "0.1.0"
description = "Safe buttons for predefined actions, backed by Postgres."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "fastapi>=0.143",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.isort]
# The local alembic/ directory would otherwise be mistaken for the alembic package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
