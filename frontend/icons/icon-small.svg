<!-- For 16 and 32 px: plain squares on whole pixels at both sizes (32-unit grid
     4 + 10 + 4 + 10 + 4, so 2 + 5 + 2 + 5 + 2 at 16 px). The big icon's thin gaps and
     rounded corners blur or notch when scaled down this far. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#09090b"/>
  <g shape-rendering="crispEdges">
    <rect x="4" y="4" width="10" height="10" fill="#10b981"/>
    <rect x="18" y="4" width="10" height="10" fill="#f59e0b"/>
    <rect x="4" y="18" width="10" height="10" fill="#0ea5e9"/>
    <rect x="18" y="18" width="10" height="10" fill="#ef4444"/>
  </g>
</svg>
